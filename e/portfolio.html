    <script src="e.js"></script>
    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('toast--show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('toast--show'), 2500);
        }

        document.getElementById('btn-email').addEventListener('click', () => {
            navigator.clipboard.writeText('kaziaidahhaque@gmail.com');
            showToast('Email copied!');
        });

        document.getElementById('btn-discord').addEventListener('click', () => {
            navigator.clipboard.writeText('@Kazi_Aidah');
            showToast('Username copied: @Kazi_Aidah');
        });
    </script>
