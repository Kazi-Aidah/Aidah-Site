<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Aidah's Site</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="intro-mobile.js"></script>
  <script async src="https://tally.so/widgets/embed.js"></script>
</head>

<style>
    :root {
        --clr-blue: #344d97;
        --clr-blue-light: #586fb6;
        --clr-blue-text: #A6BCFF;
    }

    * {
        font-family: var(--fnt-d);
        border-radius: 0px;
        corner-shape: squircle;
        -webkit-tap-highlight-color: transparent;
    }

    .file-explorer {
        background-color: var(--bg-sec);
        margin: auto;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        width: 80%;
    }
    
    .file-explorer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        background-color: var(--clr-blue);
        border-top: 4px solid var(--clr-blue-light);
        border-bottom: 6px solid var(--bg-pri);
        padding: 4px;
        height: 46px;
    }
    .file-explorer-header p {
        font-family: var(--fnt-d);
        color: var(--clr-blue-text);
        font-size: 16px;
    }
    .header-left {
        display: flex;
        align-items: flex-start;
        gap: 3px;
    }
    .header-right {
        display: flex;
        align-items: flex-end;
    }
    .header-left, .header-right, .close-btn {
        width: 30px;
        height: 30px;

        transform: all 2s ease;
    }
    .header-left img, .header-right img, .close-btn img {
        cursor: hand;
        transform: scale(0.9);
        filter: brightness(1.1);
    }
    .header-left img:hover, .header-right img:hover, .close-btn img:hover {
        cursor: pointer;
        transform: scale(1);
        filter: brightness(1);
        border: 2px solid var(--clr-blue-light);
    }
    .header-left img:active, .header-right img:active, .close-btn img:active {
        cursor: pointer;
        transform: scale(1);
        filter: brightness(0.8);
        border: 3px inset var(--clr-blue-light);
    }


    .file-explorer-body {
        padding: 10px;
        background-color: var(--bg-sec);
        min-height: 300px;
        height: auto;
    }

    .grouped-by {
        background-color: var(--bg-ter);
        margin-bottom: 6px;
        padding: 4px 10px;
        cursor: pointer;
    }

    .grouped-by::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 12px;
        background-image: url("assets/file-exp-chevron.png");
        background-size: cover;
        background-position: center;
        margin-right: 10px;
        margin-left: 4px;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .is-collapsed::before {
        transform: rotate(90deg);
        margin-right: 14px;
        margin-left: 4px;
    }

    .grouped-by-content {
        display: block;
        padding: 5px 0 5px 25px;
    }

    .grouped-by.icons .grouped-by-content {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 15px;
    }

    .grouped-by.is-collapsed .grouped-by-content {
        display: none;
    }

    .grouped-by.is-collapsed::before {
        transform: rotate(90deg);
        margin-right: 14px;
        margin-left: 4px;
    }

    .grouped-by.icons .grouped-by-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 80px;
        text-align: center;
        gap: 8px;
        padding: 10px 5px;
        border: 2px solid transparent;
    }

    .grouped-by.icons .grouped-by-item img {
        width: 48px;
        height: 48px;
        object-fit: contain;
    }

    .grouped-by.icons .grouped-by-item span {
        word-break: break-word;
        font-size: 12px;
    }

    .grouped-by-item {
        padding: 4px 8px;
        font-size: 14px;
        color: var(--txt-m);
        transition: all 0.2s;
        border: 2px solid transparent;

        transition: margin 0.2s step-start;
    }

    .grouped-by-item:hover {
        background-color: #1a1a2a80;
        color: var(--txt-n);
        border: 2px solid var(--clr-blue-light);
    }

    .grouped-by-item:active {
        background-color: #1a1a2a;
        color: var(--txt-n);
        border: 2px solid var(--bg-ter);
        margin-left: 1px;
    }

    .grouped-by.icons .grouped-by-item:hover {
        background-color: #1a1a2a80;
        color: var(--txt-n);
        border: 2px solid var(--clr-blue-light);
    }

    .grouped-by.icons .grouped-by-item:active {
        background-color: #1a1a2a;
        color: var(--txt-n);
        border: 2px solid var(--bg-ter);
        margin-left: 0px !important;
    }

    /* .grouped-by-item img {
        min-width: 60px;
        min-height: 60px;
    } */

    /* .grouped-by-item:active::before {
        content: "|";
        display: inline-block;
        color: var(--txt-m);
        width: 7px;
        height: 12px;
        margin-right: 10px;
        margin-left: 4px;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    } */

</style>

<body>
  <div class="page-wrapper">
    <div class="file-explorer">

      <div class="file-explorer-header">
        <div class="header-left">
            <img src="assets/file-exp-leftarrow.png" alt="Close" class="close-btn" />
            <img src="assets/file-exp-rightarrow.png" alt="Close" class="close-btn" />
        </div>
        <div class="header-center">
            <p>File Explorer</p>
        </div>
        <div class="header-right">
            <img src="assets/file-exp-close.png" alt="Close" class="close-btn" />
        </div>
      </div>

      <div class="file-explorer-body">
        <div class="grouped-by icons">Favorites
            <div class="grouped-by-content">
                <div class="grouped-by-item">
                    <img src="images/pfp.png" alt="Icon" />
                    <span>pfp</span>
                </div>
                <div class="grouped-by-item">
                    <img src="images/favicon.png" alt="Icon" />
                    <span>pfp circle</span>
                </div>
                <div class="grouped-by-item">
                    <img src="images/aidahstar.gif" alt="Icon" />
                    <span>star</span>
                </div>
            </div>
        </div>
        <div class="grouped-by">Knights
            <div class="grouped-by-content">
                <div class="grouped-by-item">Knight 1</div>
                <div class="grouped-by-item">Knight 2</div>
                <div class="grouped-by-item">Knight 3</div>
            </div>
        </div>
        <div class="grouped-by is-collapsed">Ranks
            <div class="grouped-by-content">
                <div class="grouped-by-item">Knight 1</div>
                <div class="grouped-by-item">Knight 2</div>
                <div class="grouped-by-item">Knight 3</div>
            </div>
        </div>
      </div>

    </div>

    <script>
        document.querySelectorAll('.grouped-by').forEach(group => {
            group.addEventListener('click', (e) => {
                // Toggle only if the click is on the group itself, not on items or content
                if (!e.target.closest('.grouped-by-content')) {
                    group.classList.toggle('is-collapsed');
                }
            });
        });
    </script>
</body>
</html>
